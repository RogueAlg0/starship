<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Starship — viewer</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%9A%80%3C/text%3E%3C/svg%3E">
<style>
  :root {
    --bg: #0b0f16;
    --panel: #131a26;
    --panel-2: #182233;
    --line: #2c3e5a;
    --text: #dbe4f0;
    --muted: #8fa3bf;
    --accent: #e8a33d;
    --good: #57c465;
    --warn: #e8a33d;
    --bad: #e5534b;
    --tabh: calc(56px + env(safe-area-inset-bottom));
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100dvh; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  button {
    background: var(--panel-2);
    color: var(--text);
    border: 1px solid var(--line);
    border-radius: 8px;
    min-height: 40px;
    padding: 6px 14px;
    font-size: 15px;
    cursor: pointer;
    touch-action: manipulation;
  }
  button:active { transform: translateY(1px); }
  button.active {
    border-color: var(--accent);
    color: var(--accent);
    font-weight: 700;
  }

  /* ------------------------------------------------ stage */
  #stage {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
    position: relative;
  }
  /* The one status strip: ship, day, time, watch, weather,
     position. One line; it truncates before it ever wraps. */
  #status-strip {
    flex: none;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 4px 10px;
    background: var(--panel);
    border-bottom: 1px solid var(--line);
    z-index: 5;
  }
  #ship-name {
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 0.02em;
    white-space: nowrap;
  }
  #watch-icon { image-rendering: pixelated; flex: none; }
  #strip-line {
    flex: 1;
    min-width: 0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    font-size: 13.5px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }
  #status-strip button {
    flex: none;
    min-height: 38px;
    min-width: 46px;
    padding: 4px 10px;
    font-size: 14px;
  }
  #play-btn { font-weight: 700; }
  /* The menu row: view toggles and the run's cold numbers,
     behind the strip's menu button. */
  #menu-row {
    flex: none;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 6px 14px;
    padding: 6px 10px;
    background: var(--panel);
    border-bottom: 1px solid var(--line);
    font-size: 13px;
    color: var(--muted);
    z-index: 5;
  }
  #menu-row[hidden] { display: none; }
  #menu-row .meta b { color: var(--text); font-weight: 600; }
  #menu-row button { min-height: 34px; padding: 3px 12px; font-size: 13.5px; }
  #hash { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }

  .ship-stage {
    flex: 1;
    min-height: 0;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    background: #04060a;
  }
  #ship-canvas {
    max-width: 100%;
    max-height: 100%;
    display: block;
    image-rendering: pixelated;
    cursor: pointer;
  }
  /* The scene chip: what the deck is doing right now, in the
     reference's style ("Council · Inquiry · 5 seated"). */
  #scene-chip {
    position: absolute;
    top: 8px;
    left: 8px;
    z-index: 6;
    max-width: 52%;
    padding: 5px 10px;
    background: rgba(11, 16, 24, 0.88);
    border: 1px solid var(--line);
    border-radius: 8px;
    font-size: 13px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    pointer-events: none;
  }
  #view-switch {
    position: absolute;
    left: 8px;
    bottom: 8px;
    z-index: 6;
    display: flex;
    gap: 6px;
  }
  #view-switch button {
    min-height: 36px;
    padding: 4px 12px;
    font-size: 13.5px;
    font-weight: 600;
    background: rgba(24, 34, 51, 0.92);
  }
  #view-switch button.active {
    border-color: var(--good);
    color: var(--good);
  }
  #minimap-canvas {
    position: absolute;
    right: 8px;
    bottom: 8px;
    z-index: 6;
    width: 132px;
    height: 42px;
    image-rendering: pixelated;
    background: rgba(11, 15, 22, 0.9);
    border: 1px solid var(--line);
    border-radius: 6px;
    cursor: pointer;
  }
  @media (min-width: 980px) {
    #minimap-canvas { width: 176px; height: 56px; }
  }
  @media (max-width: 760px) {
    /* The strip's line outranks the ship's name at phone widths:
       the name lives in the Ship sheet, the line must fit. The
       watch icon goes too: the watch word already says it. */
    #ship-name { display: none; }
    #watch-icon { display: none; }
    #status-strip { gap: 5px; padding: 4px 6px; }
    #status-strip button { min-width: 40px; padding: 4px 7px; font-size: 13.5px; }
    #strip-line { font-size: 12px; }
    /* The minimap rides above the view switch: side by side they
       are wider than a phone. */
    #minimap-canvas { bottom: 52px; }
  }

  /* ------------------------------------------------ alerts */
  /* Whitelisted cards over the deck's top-right, capped by the
     stack itself (2 phone, 4 desktop). */
  #alert-stack {
    position: absolute;
    top: 8px;
    right: 8px;
    z-index: 7;
    width: min(320px, 74%);
    display: flex;
    flex-direction: column;
    gap: 6px;
    pointer-events: none;
  }
  .alert {
    pointer-events: auto;
    position: relative;
    display: flex;
    align-items: stretch;
    background: rgba(11, 16, 24, 0.93);
    border: 1px solid var(--line);
    border-left: 4px solid #5b7290;
    border-radius: 8px;
    box-shadow: 0 6px 18px rgba(0, 0, 0, 0.45);
    overflow: hidden;
    transition: opacity 0.25s ease, transform 0.25s ease;
  }
  .alert.tier-critical { border-left-color: var(--bad); }
  .alert.tier-major { border-left-color: var(--warn); }
  .alert.enter { opacity: 0; transform: translateX(10px); }
  .alert.leaving { opacity: 0; }
  .alert-main {
    flex: 1;
    display: flex;
    align-items: center;
    gap: 8px;
    min-width: 0;
    min-height: 40px;
    padding: 6px 8px;
    background: none;
    border: none;
    border-radius: 0;
    color: var(--text);
    font-size: 13px;
    text-align: left;
  }
  .alert-icon {
    width: 18px;
    height: 18px;
    flex: none;
    image-rendering: pixelated;
  }
  .alert-text {
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .alert-x {
    flex: none;
    align-self: stretch;
    min-width: 36px;
    min-height: 40px;
    padding: 0 6px;
    background: none;
    border: none;
    border-left: 1px solid var(--line);
    border-radius: 0;
    color: var(--muted);
    font-size: 16px;
  }
  .alert-life {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 2px;
    background: rgba(255, 255, 255, 0.08);
  }
  .alert-life-fill {
    height: 100%;
    width: 100%;
    background: var(--warn);
    animation-name: alert-burn;
    animation-timing-function: linear;
    animation-fill-mode: forwards;
  }
  .alert.tier-critical .alert-life-fill { background: var(--bad); }
  @keyframes alert-burn { from { width: 100%; } to { width: 0%; } }
  @media (prefers-reduced-motion: reduce) {
    .alert { transition: opacity 0.25s ease; }
    .alert.enter { transform: none; }
    #sheet { transition: none; }
  }

  /* ------------------------------------------------ sheet */
  /* One sheet for every panel: 64dvh, slid down out of sight
     when closed; only its body scrolls. On desktop it docks to
     the right edge instead. */
  #sheet {
    position: fixed;
    left: 0;
    right: 0;
    bottom: var(--tabh);
    height: 64dvh;
    z-index: 8;
    background: var(--panel);
    border-top: 2px solid var(--accent);
    box-shadow: 0 -8px 30px rgba(0, 0, 0, 0.5);
    transform: translateY(106%);
    transition: transform 0.22s ease-out;
    display: flex;
    flex-direction: column;
  }
  #sheet:not(.closed) { transform: none; }
  #sheet-head {
    flex: none;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 6px 12px;
    border-bottom: 1px solid var(--line);
  }
  #sheet-title { font-size: 15px; font-weight: 700; }
  #sheet-close { min-height: 36px; min-width: 42px; padding: 2px 10px; font-size: 18px; line-height: 1; }
  #sheet-body {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    overscroll-behavior: contain;
    padding: 10px 12px calc(12px + env(safe-area-inset-bottom));
  }
  #sheet-body section { min-width: 0; }
  #sheet-body h3 {
    margin: 14px 0 6px;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.09em;
    color: var(--muted);
    font-weight: 600;
  }
  #sheet-body h3:first-child { margin-top: 0; }
  @media (min-width: 980px) {
    #sheet {
      left: auto;
      top: 47px;
      bottom: var(--tabh);
      width: 440px;
      height: auto;
      border-top: none;
      border-left: 2px solid var(--accent);
      transform: translateX(106%);
    }
    #sheet:not(.closed) { transform: none; }
  }

  /* ------------------------------------------------ tab bar */
  #tabbar {
    flex: none;
    height: var(--tabh);
    padding-bottom: env(safe-area-inset-bottom);
    display: flex;
    background: var(--panel);
    border-top: 1px solid var(--line);
    z-index: 9;
  }
  #tabbar button {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1px;
    background: none;
    border: none;
    border-radius: 0;
    min-height: 0;
    padding: 3px 0;
    font-size: 20px;
    line-height: 1.1;
    color: var(--muted);
  }
  #tabbar button small {
    font-size: 9.5px;
    text-transform: uppercase;
    letter-spacing: 0.09em;
  }
  #tabbar button.on {
    color: var(--accent);
    background: var(--panel-2);
  }

  /* ------------------------------------------------ crew */
  .crew-row {
    display: grid;
    grid-template-columns: 44px minmax(0, 1fr);
    gap: 4px 10px;
    padding: 7px 6px;
    border-radius: 8px;
    cursor: pointer;
    align-items: center;
  }
  .crew-row + .crew-row { border-top: 1px solid #1d293d; }
  .crew-row.selected { background: var(--panel-2); }
  .crew-row .face {
    width: 40px; height: 40px;
    border-radius: 9px;
    border: 2px solid var(--line);
    background: var(--panel-2);
    image-rendering: pixelated;
    grid-row: span 2;
  }
  .crew-row .who { min-width: 0; }
  .crew-row .who .name { font-size: 14.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .crew-row .who .role { font-size: 12px; color: var(--muted); }
  .crew-row .needs {
    grid-column: 2;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 6px;
  }
  .need { display: flex; flex-direction: column; gap: 2px; }
  .need .need-label { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }
  .need .bar { height: 6px; background: #0d1420; border-radius: 3px; overflow: hidden; }
  .need .bar > div { height: 100%; background: var(--good); border-radius: 3px; }
  .need .bar > div.low { background: var(--bad); }
  .need .bar > div.mid { background: var(--warn); }

  /* ------------------------------------------------ council */
  .seat-row {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    padding: 4px 6px;
    font-size: 13.5px;
    border-top: 1px solid #1d293d;
  }
  .seat-row:first-child { border-top: none; }
  .seat-row .seat-name { color: var(--muted); }
  .seat-row .seat-holder { font-weight: 600; text-align: right; }
  .seat-row .seat-holder.vacant { color: var(--muted); font-weight: 400; }
  .legitimacy-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px;
    font-size: 13px;
    color: var(--muted);
  }
  .legitimacy-row .sbar {
    flex: 1;
    height: 6px;
    background: #0a0f18;
    border-radius: 3px;
    overflow: hidden;
  }
  .legitimacy-row .sbar > div { height: 100%; background: var(--good); }
  .legitimacy-row .sbar > div.warn { background: var(--warn); }
  .legitimacy-row .sbar > div.crit { background: var(--bad); }
  .legitimacy-row .sval { color: var(--text); font-variant-numeric: tabular-nums; }
  .sitting-row {
    display: flex;
    align-items: baseline;
    gap: 8px;
    width: 100%;
    padding: 8px 6px;
    background: none;
    border: none;
    border-top: 1px solid #1d293d;
    border-radius: 0;
    min-height: 40px;
    font-size: 13.5px;
    text-align: left;
    color: var(--text);
  }
  .sitting-row .s-time { color: var(--muted); font-variant-numeric: tabular-nums; flex: none; }
  .sitting-row .s-main { flex: 1; min-width: 0; }
  .sitting-row .s-verdict { font-weight: 700; flex: none; }
  .truth-chip {
    flex: none;
    font-size: 11px;
    font-weight: 700;
    padding: 2px 7px;
    border-radius: 6px;
    background: #3a2320;
    color: #ff9a8a;
  }
  .truth-chip.good { background: #1d3320; color: #8fe3a0; }
  #council-back { min-height: 36px; padding: 4px 12px; font-size: 13.5px; margin-bottom: 8px; }
  #council-transcript {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 12.5px;
    line-height: 1.55;
    color: #c9d6ea;
  }
  #council-transcript .tline { padding: 2px 0; border-top: 1px solid #1d293d; }
  #council-transcript .tline:first-child { border-top: none; }
  .sheet-empty { color: var(--muted); font-size: 13.5px; padding: 6px; }

  /* ------------------------------------------------ chronicle */
  .sheet-tools {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    margin-bottom: 6px;
  }
  [hidden] { display: none !important; }
  .log-toggle { display: flex; gap: 4px; }
  .log-toggle button {
    min-height: 30px;
    padding: 3px 10px;
    font-size: 12.5px;
    border-radius: 6px;
  }
  #feed { display: flex; flex-direction: column; gap: 8px; padding: 4px 2px; }
  .feed-card { background: #131a28; border: 1px solid #26314a; border-radius: 10px; padding: 8px 10px; }
  .feed-head { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
  .feed-avatar { width: 28px; height: 28px; border-radius: 50%; border: 1px solid #39465c; image-rendering: pixelated; flex: none; }
  .feed-avatar.ship { display: flex; align-items: center; justify-content: center; font-size: 15px; background: #1b2436; }
  .feed-who { font-size: 12px; font-weight: 600; color: #d7e2f0; flex: 1; min-width: 0; }
  .feed-time { font-size: 10px; color: #7e93b0; font-family: monospace; flex: none; }
  .feed-text { font-size: 13px; line-height: 1.45; color: #c3cfe0; }
  .feed-reply { display: flex; gap: 6px; margin-top: 6px; margin-left: 18px; padding: 6px 8px; background: #101623; border-radius: 8px; align-items: flex-start; }
  .feed-reply .feed-avatar { width: 20px; height: 20px; }
  .feed-reply-text { font-size: 12px; color: #a9bcd6; line-height: 1.4; }
  .feed-reply-name { font-weight: 600; color: #d7e2f0; }
  .poll-q { font-size: 13px; font-weight: 600; color: #e8eef7; margin: 2px 0 6px; }
  .poll-row { margin-bottom: 5px; }
  .poll-label { font-size: 11px; color: #a9bcd6; text-transform: capitalize; }
  .poll-track { height: 6px; background: #0d1220; border-radius: 3px; overflow: hidden; margin: 2px 0; }
  .poll-fill { height: 100%; background: #57a8e8; }
  .poll-fill.against { background: #d87f6a; }
  .poll-fill.abstain { background: #5d7186; }
  .poll-names { font-size: 10px; color: #7e93b0; }
  .poll-outcome { font-size: 12px; color: #d7e2f0; margin-top: 4px; }
  .feed-empty { color: #7e93b0; font-size: 12px; padding: 8px 2px; }
  .feed-head.tappable { cursor: pointer; }
  .feed-reactions { display: flex; gap: 4px; align-items: center; margin-top: 6px; }
  .feed-reactions .feed-avatar { width: 18px; height: 18px; }
  .feed-reactions .heart { color: #e88ca0; font-size: 11px; margin-left: 2px; }
  .feed-lanes { display: flex; gap: 4px; flex-wrap: wrap; padding: 6px 0 8px; position: sticky; top: 0; background: var(--panel); z-index: 2; }
  .feed-lanes button { background: #101623; color: #a9bcd6; border: 1px solid #26314a; border-radius: 7px; padding: 4px 10px; font-size: 11px; cursor: pointer; }
  .feed-lanes button.active { border-color: var(--accent); color: var(--accent); font-weight: 700; }
  .person-tabs { display: flex; gap: 4px; flex-wrap: wrap; margin: 4px 0 8px; }
  .person-tabs button { background: #101623; color: #a9bcd6; border: 1px solid #26314a; border-radius: 7px; padding: 4px 10px; font-size: 11px; cursor: pointer; }
  .person-tabs button.active { border-color: var(--accent); color: var(--accent); font-weight: 700; }
  .match-strip { margin-top: 7px; background: #0d1421; border: 1px solid #22304a; border-radius: 8px; padding: 6px 8px; }
  .match-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 5px; }
  .match-cond { font-size: 10px; font-weight: 700; letter-spacing: 0.04em; text-transform: capitalize; padding: 2px 6px; border-radius: 6px; background: #1a2438; color: #c3cfe0; }
  .match-score { font-size: 11px; color: #a9bcd6; text-align: right; }
  .match-runs { display: flex; gap: 4px; flex-wrap: wrap; }
  .match-run { display: flex; flex-direction: column; gap: 3px; }
  .mini-card { display: inline-flex; align-items: center; justify-content: center; min-width: 30px; padding: 3px 4px; border-radius: 5px; border: 1px solid #33436b; background: #16203a; color: #d7e2f0; font-size: 11px; font-weight: 700; line-height: 1; }
  .mini-card.suit-helm { border-color: #3f6ea6; background: #14273e; }
  .mini-card.suit-forge { border-color: #a66a2f; background: #38220f; }
  .mini-card.suit-leaf { border-color: #4d8a4a; background: #17301a; }
  .mini-card.suit-coin { border-color: #a68d2f; background: #38300f; }
  .match-cond.suit-helm { color: #8fc3ff; }
  .match-cond.suit-forge { color: #ffbe78; }
  .match-cond.suit-leaf { color: #9fe89f; }
  .match-cond.suit-coin { color: #ffe98a; }
  .mini-card.won { box-shadow: 0 0 0 1px #e8eef7, 0 0 7px rgba(232, 238, 247, 0.45); color: #ffffff; }
  .mini-card.burned { opacity: 0.45; }
  .deck-strip { display: flex; flex-wrap: wrap; gap: 3px; margin: 2px 0 8px; }
  @keyframes feed-in { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }
  .feed-card:first-child { animation: feed-in 0.3s ease-out; }
  .log-toggle button.active {
    border-color: var(--accent);
    color: var(--accent);
    font-weight: 700;
  }
  #chronicle {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 13px;
    line-height: 1.5;
    padding: 4px 2px;
    overflow-wrap: anywhere;
  }
  #chronicle .line { padding: 1px 6px; border-radius: 4px; }
  #chronicle .line.routine { color: #93a5c4; }
  #chronicle .line.hl { color: #f0dfae; }
  #chronicle .line.dim { opacity: 0.28; }
  #chronicle .line.blank { padding: 0; }

  /* ------------------------------------------------ ship sheet */
  /* The stores: five labelled bars, days of supply as a number,
     band colour carrying the alarm (green, amber under ten days,
     red under four), the council's legitimacy as a sixth row. */
  #stores-strip { display: flex; flex-direction: column; gap: 7px; }
  .store-cell { display: flex; align-items: center; gap: 8px; }
  .store-cell .slabel {
    flex: none;
    width: 52px;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--muted);
  }
  .store-cell .sbar {
    flex: 1;
    height: 8px;
    background: #0a0f18;
    border-radius: 4px;
    overflow: hidden;
  }
  .store-cell .sbar > div { height: 100%; background: var(--good); border-radius: 4px; }
  .store-cell .sbar > div.warn { background: var(--warn); }
  .store-cell .sbar > div.crit { background: var(--bad); }
  .store-cell .sval {
    flex: none;
    width: 58px;
    text-align: right;
    font-size: 13px;
    color: var(--text);
    font-variant-numeric: tabular-nums;
  }
  #route-readout { font-size: 14px; padding: 2px 0 4px; }
  .seed-group { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }

      legitimacyCell.value.textContent = `${legitimacy}%`;
    }
  }
  function updateSlowUi() {
    updateRoute();
    updateStrip();
    updateSceneChip();
    updateStoresStrip();
    updateDutiesList();
    updateFactionsList();
    syncAlerts();
    if (sheetTab === "council") {
      renderCouncilSeats();
      if (sittingsDirty && detailSittingId === null) {
        renderSittingList();
        sittingsDirty = false;
      }
    }
    if (cardPortIndex !== null && performance.now() - lastPortRenderMs > 1e3) {
      lastPortRenderMs = performance.now();
      renderPortCard();
    }
    if (cardTrafficIndex !== null && performance.now() - lastTrafficRenderMs > 1e3) {
      lastTrafficRenderMs = performance.now();
      renderTrafficCard();
    }
    for (const member of run.crew) {
      const ui = crewUi.get(member.id);
      if (ui === void 0) continue;
      const top = topDiscipline(member);
      const skillText = `${DISCIPLINE_SHORT[top.discipline]} ${top.level}`;
      const roleText = member.dead ? `${member.title} \xB7 ${skillText} \xB7 Deceased` : member.leftShip ? `${member.title} \xB7 ${skillText} \xB7 Put off the ship` : member.ashore ? `${member.title} \xB7 ${skillText} \xB7 Ashore` : `${member.title} \xB7 ${skillText}`;
      if (ui.roleEl.textContent !== roleText) {
        ui.roleEl.textContent = roleText;
      }
      for (const key2 of NEED_KEYS) {
        const fill2 = ui.bars.get(key2);
        if (fill2 === void 0) continue;
        const value = member.needs[key2];
        const pct2 = Math.round(value * 100);
        const band = value < 0.25 ? "low" : value < 0.5 ? "mid" : "";
        const sig2 = `${pct2}|${band}`;
        if (fill2.dataset.sig !== sig2) {
          fill2.dataset.sig = sig2;
          fill2.style.width = `${pct2}%`;
          fill2.className = band;
        }
      }
      const state = faceStateOf(member);
      const sig = stateSignature(state);
      if (ui.sig !== sig) {
        ui.sig = sig;
        const faceCtx = ui.face.getContext("2d");
        if (faceCtx !== null) {
          faceCtx.clearRect(0, 0, ui.face.width, ui.face.height);
          faceCtx.drawImage(getPortraitCanvas(member, state), 0, 0);
        }
      }
    }
    if (cardCrewId !== null && performance.now() - lastCardRenderMs > 1e3) {
      lastCardRenderMs = performance.now();
      renderPersonCard();
    }
  }
  function frame(nowMs) {
    requestAnimationFrame(frame);
    const dtMs = lastFrameMs === 0 ? 0 : nowMs - lastFrameMs;
    lastFrameMs = nowMs;
    if (playing) {
      const speed = SPEEDS[speedIndex];
      accumulator += dtMs / 1e3 * speed.ticksPerSecond;
      let steps = Math.floor(accumulator);
      if (steps > MAX_TICKS_PER_FRAME) {
        steps = MAX_TICKS_PER_FRAME;
        accumulator = 0;
      } else {
        accumulator -= steps;
      }
      if (steps > 0) {
        for (let i = 0; i < steps; i++) run.step();
        drainEvents();
        updateHeader();
      }
    }
    alertView.frame(nowMs);
    const deckDue = playing || nowMs - lastDeckMs >= 66;
    if (mapActive && starMap !== null) {
      if (deckDue) {
        lastDeckMs = nowMs;
        starMap.frame(run.tick, nowMs);
      }
    } else if (deck !== null && deckDue) {
      pruneGames();
      pruneSittings();
      const deckDtMs = lastDeckMs === 0 ? dtMs : nowMs - lastDeckMs;
      lastDeckMs = nowMs;
      const tickMs = playing ? 1e3 / SPEEDS[speedIndex].ticksPerSecond : Number.POSITIVE_INFINITY;
      const aboard = run.crew.filter((m) => !m.ashore && !m.dead && !m.leftShip);
      const presented = activeSittings.length === 0 ? aboard : aboard.map((m) => {
        const seat = councilSeatByMember.get(m.id);
        const stand = councilStandByMember.get(m.id);
        const spot = seat ?? stand;
        if (spot === void 0 || spot.room === m.room) return m;
        return { ...m, room: spot.room, activity: "socialize" };
      });
      deck.frame(presented, {
        now: nowMs,
        dtMs: deckDtMs,
        tickMs,
        snap: speedIndex >= 4,
        selectedId: selectedCrew,
        workSystem: workSystemByMember,
        gameSeat: gameSeatByMember,
        councilSeat: councilSeatByMember,
        councilStand: councilStandByMember,
        carry: carryByMember,
        showWear,
        showBubbles,
        dayMinutes: run.tick % CONFIG.time.ticksPerDay * CONFIG.time.minutesPerTick,
        storm: weatherName === "radiation storm",
        meal: mealWindowAt(run.tick),
        contact: exteriorContact(),
        tick: run.tick,
        speedTps: playing ? SPEEDS[speedIndex].ticksPerSecond : 0
      });
    }
    if (nowMs - lastSlowUiMs > 200) {
      lastSlowUiMs = nowMs;
      updateSlowUi();
      updateHeader();
    }
    if (minimap !== null && deck !== null && !mapActive && nowMs - lastMinimapMs > 250) {
      lastMinimapMs = nowMs;
      const aboard = run.crew.filter((m) => !m.ashore && !m.dead && !m.leftShip);
      minimap.draw(
        run.ship,
        aboard,
        deck.minimapSnapshot(aboard),
        deck.visibleDeck,
        nowMs
      );
    }
  }
  function setPlaying(next) {
    playing = next;
    playBtn.textContent = playing ? "Pause" : "Play";
  }
  function setSpeed(index) {
    speedIndex = Math.max(0, Math.min(SPEEDS.length - 1, index));
    const speed = SPEEDS[speedIndex];
    speedBtn.textContent = speed.label;
  }
  speedBtn.addEventListener("click", () => {
    setSpeed((speedIndex + 1) % SPEEDS.length);
  });
  playBtn.addEventListener("click", () => setPlaying(!playing));
  menuBtn.addEventListener("click", () => {
    menuRow.hidden = !menuRow.hidden;
  });
  function setToggle(which, on, persist = true) {
    if (which === "wear") showWear = on;
    else showBubbles = on;
    const button = which === "wear" ? toggleWearBtn : toggleBubblesBtn;
    button.classList.toggle("active", on);
    button.setAttribute("aria-pressed", String(on));
    if (persist) {
      try {
        window.localStorage.setItem(
          "starship.toggles",
          JSON.stringify({ wear: showWear, bubbles: showBubbles })
        );
      } catch {
      }
    }
  }
  toggleWearBtn.addEventListener("click", () => setToggle("wear", !showWear));
  toggleBubblesBtn.addEventListener(
    "click",
    () => setToggle("bubbles", !showBubbles)
  );
  for (const [tab, button] of tabButtons) {
    button.addEventListener("click", () => toggleSheet(tab));
  }
  must("sheet-close").addEventListener("click", () => {
    closeSheet();
  });
  must("council-back").addEventListener("click", () => {
    showSittingList();
  });
  function buildAlertPrefs() {
    alertPrefsEl.replaceChildren();
    for (const def of ALERT_KIND_DEFS) {
      const row = document.createElement("label");
      row.className = "pref-row";
      const label = document.createElement("span");
      label.textContent = def.label;
      const box = document.createElement("input");
      box.type = "checkbox";
      box.dataset.pauseKind = def.kind;
      box.checked = pausePrefs[def.kind];
      box.addEventListener("change", () => {
        pausePrefs[def.kind] = box.checked;
        savePausePrefs(pausePrefs);
      });
      row.append(label, box);
      alertPrefsEl.appendChild(row);
    }
  }
  dailyBtn.addEventListener("click", () => startDailyVoyage());
  decksBtn.addEventListener(
    "click",
    () => setViewDeck(deck?.visibleDeck ?? 0)
  );
  exteriorBtn.addEventListener("click", () => setViewExterior());
  mapBtn.addEventListener("click", () => setViewMap());
  minimapCanvas.addEventListener("click", (event) => {
    if (minimap === null) return;
    const rect = minimapCanvas.getBoundingClientRect();
    if (rect.width === 0 || rect.height === 0) return;
    const x = (event.clientX - rect.left) * (minimapCanvas.width / rect.width);
    const y = (event.clientY - rect.top) * (minimapCanvas.height / rect.height);
    const target = minimap.deckAt(x, y);
    if (target !== null) setViewDeck(target);
  });
  deckCanvas.addEventListener("click", (event) => {
    const rect = deckCanvas.getBoundingClientRect();
    if (rect.width === 0 || rect.height === 0) return;
    const x = (event.clientX - rect.left) * (deckCanvas.width / rect.width);
    const y = (event.clientY - rect.top) * (deckCanvas.height / rect.height);
    if (mapActive && starMap !== null) {
      const hit = starMap.pick(x, y, run.tick);
      if (hit !== null && hit.kind === "port") openPortCard(hit.port);
      else if (hit !== null && hit.kind === "traffic") openTrafficCard(hit.ship);
      else {
        closePortCard();
        closeTrafficCard();
      }
      return;
    }
    if (deck !== null && deck.exteriorActive) {
      const target = deck.pickSection(x, y);
      if (target !== null) setViewDeck(target);
      return;
    }
    const id = deck?.pick(x, y);
    if (id !== null && id !== void 0) tapCrew(id);
  });
  must("new-voyage-btn").addEventListener("click", () => {
    const seed = Number(seedInput.value);
    startVoyage(Number.isFinite(seed) ? Math.trunc(seed) : 42);
  });
  must("random-btn").addEventListener("click", () => {
    startVoyage(Math.floor(Math.random() * 1e6));
  });
  logHighlightsBtn.addEventListener("click", () => setLogMode("highlights"));
  logFullBtn.addEventListener("click", () => setLogMode("full"));
  sheetBodyEl.addEventListener("scroll", () => {
    if (sheetTab !== "log") return;
    stickToBottom = sheetBodyEl.scrollHeight - sheetBodyEl.scrollTop - sheetBodyEl.clientHeight < 40;
  });
  window.addEventListener("keydown", (event) => {
    const target = event.target;
    if (target instanceof HTMLInputElement || target instanceof HTMLTextAreaElement) {
      return;
    }
    if (event.code === "Space") {
      event.preventDefault();
      setPlaying(!playing);
    } else if (event.key === "Escape") {
      selectCrew(null);
      closePersonCard();
      closePortCard();
      closeTrafficCard();
      closeSheet();
    } else if (event.key >= "1" && event.key <= "6") {
      setSpeed(Number(event.key) - 1);
    } else if (event.key === "7" || event.key === "[") {
      setViewDeck(0);
    } else if (event.key === "8" || event.key === "]") {
      setViewDeck(1);
    } else if (event.key === "9") {
      setViewExterior();
    } else if (event.key === "0" || event.key === "m" || event.key === "M") {
      setViewMap();
    }
  });
  var params = new URLSearchParams(window.location.search);
  setLogMode(initialLogMode(params), false);
  setSpeed(speedIndex);
  setPlaying(true);
  buildAlertPrefs();
  document.body.dataset.view = "deck";
  {
    const phoneQuery = window.matchMedia("(max-width: 760px)");
    const applyPhone = () => alertStack.setPhoneMode(phoneQuery.matches);
    applyPhone();
    phoneQuery.addEventListener("change", applyPhone);
    let wear = true;
    let bubbles = true;
    try {
      const stored = JSON.parse(
        window.localStorage.getItem("starship.toggles") ?? "{}"
      );
      if (typeof stored.wear === "boolean") wear = stored.wear;
      if (typeof stored.bubbles === "boolean") bubbles = stored.bubbles;
    } catch {
    }
    setToggle("wear", wear, false);
    setToggle("bubbles", bubbles, false);
  }
  if (params.get("daily") === "1") {
    startDailyVoyage();
  } else {
    const initialSeed = Number(params.get("seed") ?? "42") || 42;
    startVoyage(initialSeed);
  }
  requestAnimationFrame(frame);
})();

</script>
