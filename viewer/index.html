<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Starship — viewer</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%9A%80%3C/text%3E%3C/svg%3E">
<style>
  :root {
    --bg: #0b0f16;
    --panel: #131a26;
    --panel-2: #182233;
    --line: #2c3e5a;
    --text: #dbe4f0;
    --muted: #8fa3bf;
    --accent: #e8a33d;
    --good: #57c465;
    --warn: #e8a33d;
    --bad: #e5534b;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 10px 12px 8px;
    border-bottom: 1px solid var(--line);
    background: var(--panel);
    position: sticky;
    top: 0;
    z-index: 5;
  }
  .title-row {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    gap: 6px 14px;
  }
  h1 { font-size: 20px; margin: 0; letter-spacing: 0.02em; }
  .title-row .meta { color: var(--muted); font-size: 13px; }
  .title-row .meta b { color: var(--text); font-weight: 600; }
  #hash { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  #watch-icon { image-rendering: pixelated; vertical-align: -1px; }
  .controls {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
    margin-top: 8px;
  }
  button {
    background: var(--panel-2);
    color: var(--text);
    border: 1px solid var(--line);
    border-radius: 8px;
    min-height: 40px;
    padding: 6px 14px;
    font-size: 15px;
    cursor: pointer;
    touch-action: manipulation;
  }
  button:active { transform: translateY(1px); }
  button.active {
    border-color: var(--accent);
    color: var(--accent);
    font-weight: 700;
  }
  #play-btn { min-width: 96px; font-weight: 700; }
  .speed-group { display: flex; gap: 4px; }
  .speed-group button { padding: 6px 10px; min-width: 44px; }
  .seed-group { display: flex; gap: 6px; align-items: center; }
  .seed-group label { color: var(--muted); font-size: 14px; }
  #seed-input {
    width: 92px;
    min-height: 40px;
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 6px 8px;
    font-size: 15px;
  }
  .toggle {
    display: flex;
    align-items: center;
    gap: 8px;
    min-height: 40px;
    color: var(--muted);
    font-size: 14px;
    cursor: pointer;
    user-select: none;
  }
  .toggle input { width: 20px; height: 20px; accent-color: var(--accent); }
  #daily-banner {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 6px 12px;
    margin-top: 8px;
    padding: 6px 10px;
    border: 1px solid var(--accent);
    border-radius: 8px;
    background: #171208;
    color: var(--accent);
    font-size: 14px;
  }
  #daily-banner button {
    border-color: var(--accent);
    color: var(--accent);
    min-height: 34px;
    padding: 4px 12px;
    font-size: 14px;
    font-weight: 600;
  }
  #toast {
    position: fixed;
    left: 50%;
    transform: translateX(-50%);
    bottom: 18px;
    z-index: 30;
    width: max-content;
    max-width: min(92vw, 540px);
    background: var(--panel);
    color: var(--text);
    border: 1px solid var(--accent);
    border-radius: 10px;
    padding: 10px 16px;
    font-size: 14.5px;
    text-align: center;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
  }
  /* The ship's day ribbon: a quiet strip under the header naming
     the rhythm the deck is keeping. It teaches; it does not shout. */
  #day-ribbon {
    padding: 5px 12px;
    font-size: 13px;
    color: var(--muted);
    background: #0d1320;
    border-bottom: 1px solid var(--line);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .section-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 6px;
  }
  .section-head h2 { margin: 0; }
  .log-toggle { display: flex; gap: 4px; }
  .log-toggle button {
    min-height: 30px;
    padding: 3px 10px;
    font-size: 12.5px;
    border-radius: 6px;
  }
  .log-toggle button.active {
    border-color: var(--accent);
    color: var(--accent);
    font-weight: 700;
  }
  #weather-banner {
    padding: 6px 12px;
    font-size: 14px;
    color: var(--muted);
    background: #0e141f;
    border-bottom: 1px solid var(--line);
  }
  #weather-banner b { color: var(--text); }
  #weather-banner.storm { color: var(--warn); }
  #weather-banner.storm b { color: var(--warn); }
  main {
    display: grid;
    grid-template-columns: minmax(0, 1fr);
    gap: 12px;
    padding: 12px;
    flex: 1;
    width: 100%;
    max-width: 1500px;
    margin: 0 auto;
  }
  section {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 10px;
    min-width: 0;
  }
  section h2 {
    margin: 0 0 6px;
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 0.09em;
    color: var(--muted);
    font-weight: 600;
  }
  #ship-canvas {
    width: 100%;
    height: auto;
    display: block;
    image-rendering: pixelated;
    background: #04060a;
    border-radius: 8px;
    cursor: pointer;
  }
  /* Alerts: urgency-tiered chips floated over the deck's top-right,
     the squad viewer's floating battle news. On narrow phones the
     stack leaves the overlay and runs full-width above the canvas
     instead, so it never covers the deck switcher or the minimap. */
  .ship-stage { position: relative; }
  #alert-stack {
    position: absolute;
    top: 8px;
    right: 8px;
    z-index: 6;
    width: min(320px, 72%);
    display: flex;
    flex-direction: column;
    gap: 6px;
    pointer-events: none;
  }
  .alert {
    pointer-events: auto;
    position: relative;
    display: flex;
    align-items: stretch;
    background: rgba(11, 16, 24, 0.93);
    border: 1px solid var(--line);
    border-left: 4px solid #5b7290;
    border-radius: 8px;
    box-shadow: 0 6px 18px rgba(0, 0, 0, 0.45);
    overflow: hidden;
    transition: opacity 0.25s ease, transform 0.25s ease;
  }
  .alert.tier-critical { border-left-color: var(--bad); }
  .alert.tier-major { border-left-color: var(--warn); }
  .alert.enter { opacity: 0; transform: translateX(10px); }
  .alert.leaving { opacity: 0; }
  .alert-main {
    flex: 1;
    display: flex;
    align-items: center;
    gap: 8px;
    min-width: 0;
    min-height: 40px;
    padding: 6px 8px;
    background: none;
    border: none;
    border-radius: 0;
    color: var(--text);
    font-size: 13px;
    text-align: left;
  }
  .alert-icon {
    width: 18px;
    height: 18px;
    flex: none;
    image-rendering: pixelated;
  }
  .alert-text {
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .alert-x {
    flex: none;
    align-self: stretch;
    min-width: 36px;
    min-height: 40px;
    padding: 0 6px;
    background: none;
    border: none;
    border-left: 1px solid var(--line);
    border-radius: 0;
    color: var(--muted);
    font-size: 16px;
  }
  .alert-life {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 2px;
    background: rgba(255, 255, 255, 0.08);
  }
  .alert-life-fill {
    height: 100%;
    width: 100%;
    background: #8fa3bf;
    animation-name: alert-burn;
    animation-timing-function: linear;
    animation-fill-mode: forwards;
  }
  .alert.tier-major .alert-life-fill { background: var(--warn); }
  @keyframes alert-burn { from { width: 100%; } to { width: 0%; } }
  @media (max-width: 640px) {
    #alert-stack {
      position: static;
      width: auto;
      margin-bottom: 6px;
    }
  }
  @media (prefers-reduced-motion: reduce) {
    .alert { transition: opacity 0.25s ease; }
    .alert.enter { transform: none; }
  }
  .deck-switch {
    display: flex;
    gap: 8px;
    margin-bottom: 6px;
  }
  .deck-switch button {
    flex: 1;
    min-height: 40px;
    font-size: 14px;
    font-weight: 600;
    color: var(--text);
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 8px;
    cursor: pointer;
  }
  .deck-switch button.active {
    border-color: var(--good);
    color: var(--good);
  }
  .deck-foot {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    margin-top: 6px;
  }
  #minimap-canvas {
    width: 176px;
    height: 56px;
    flex: none;
    image-rendering: pixelated;
    background: #0b0f16;
    border: 1px solid var(--line);
    border-radius: 6px;
    cursor: pointer;
  }
  .deck-hint {
    margin: 0;
    font-size: 12px;
    color: var(--muted);
    line-height: 1.5;
  }
  @media (max-width: 520px) {
    #minimap-canvas { width: 132px; height: 42px; }
  }
  #side { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
  .crew-row {
    display: grid;
    grid-template-columns: 44px minmax(0, 1fr);
    gap: 4px 10px;
    padding: 7px 6px;
    border-radius: 8px;
    cursor: pointer;
    align-items: center;
  }
  .crew-row + .crew-row { border-top: 1px solid #1d293d; }
  .crew-row.selected { background: var(--panel-2); }
  .crew-row .face {
    width: 40px; height: 40px;
    border-radius: 9px;
    border: 2px solid var(--line);
    background: var(--panel-2);
    image-rendering: pixelated;
    grid-row: span 2;
  }
  #person-card {
    position: fixed;
    z-index: 20;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 14px;
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.55);
    left: 8px;
    right: 8px;
    bottom: 8px;
    max-height: 64dvh;
    overflow-y: auto;
  }
  @media (min-width: 980px) {
    #person-card {
      left: auto;
      bottom: auto;
      top: 76px;
      right: 16px;
      width: 384px;
      max-height: calc(100dvh - 100px);
    }
  }
  #person-close {
    position: absolute;
    top: 6px;
    right: 6px;
    min-height: 36px;
    min-width: 40px;
    padding: 2px 10px;
    font-size: 18px;
    line-height: 1;
  }
  .person-head { display: flex; gap: 12px; align-items: center; }
  .person-head .face {
    width: 64px; height: 64px;
    border-radius: 10px;
    border: 2px solid var(--line);
    background: var(--panel-2);
    image-rendering: pixelated;
    flex: none;
  }
  .person-head .pname { font-size: 17px; font-weight: 700; }
  .person-head .prole { font-size: 13px; color: var(--muted); }
  .person-head .pwhere { font-size: 13px; color: var(--muted); }
  #person-bio { font-size: 14px; line-height: 1.5; margin: 10px 0 4px; }
  #person-dossier .needs {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 6px;
    margin: 8px 0;
  }
  #person-dossier .drow {
    font-size: 13px;
    padding: 3px 0;
    border-top: 1px solid #1d293d;
  }
  #person-dossier .drow b { font-weight: 600; }
  #person-dossier .dlabel {
    color: var(--muted);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-top: 8px;
  }
  #person-card h3 {
    margin: 12px 0 4px;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.09em;
    color: var(--muted);
    font-weight: 600;
  }
  #person-recent {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 12.5px;
    line-height: 1.5;
    color: #c9d6ea;
  }
  #person-recent .rline { padding: 1px 0; }
  .crew-row .who { min-width: 0; }
  .crew-row .who .name { font-size: 14.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .crew-row .who .role { font-size: 12px; color: var(--muted); }
  .crew-row .needs {
    grid-column: 2;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 6px;
  }
  .need { display: flex; flex-direction: column; gap: 2px; }
  .need .need-label { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }
  .need .bar { height: 6px; background: #0d1420; border-radius: 3px; overflow: hidden; }
  .need .bar > div { height: 100%; background: var(--good); border-radius: 3px; }
  .need .bar > div.low { background: var(--bad); }
  .need .bar > div.mid { background: var(--warn); }
  #chronicle {
    overflow-y: auto;
    height: 46dvh;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 13px;
    line-height: 1.5;
    padding: 4px 2px;
    overflow-wrap: anywhere;
  }
  #chronicle .line { padding: 1px 6px; border-radius: 4px; }
  #chronicle .line.routine { color: #93a5c4; }
  #chronicle .line.hl { color: #f0dfae; }
  #chronicle .line.dim { opacity: 0.28; }
  #chronicle .line.blank { padding: 0; }
  @media (min-width: 980px) {
    main { grid-template-columns: minmax(0, 7fr) minmax(330px, 5fr); }
    #chronicle { height: calc(100dvh - 210px); max-height: 900px; }
  }
  /* Density: the squad screen feels tight because its chrome is
     thin. Desktop gives up a few pixels of padding per surface so
     the ship claims them; phones keep their comfortable spacing,
     and no touch target drops below 40px anywhere. */
  @media (min-width: 980px) {
    header { padding: 7px 12px 6px; }
    main { gap: 10px; padding: 10px; }
    section { padding: 8px; }
    #side { gap: 10px; }
    .crew-row { padding: 6px; }
  }
</style>
</head>
<body>
<header>
  <div class="title-row">
    <h1 id="ship-name">Starship</h1>
    <span class="meta">Day <b id="clock-day">1</b>, <b id="clock-time">00:00</b></span>
    <span class="meta"><canvas id="watch-icon" width="9" height="9" aria-hidden="true"></canvas> <b id="watch-label">Day watch</b></span>
    <span class="meta">speed <b id="speed-readout">3x</b></span>
    <span class="meta">stream <b id="hash">…</b></span>
    <span class="meta"><b id="event-count">0</b> events</span>
  </div>
  <div class="controls">
    <button id="play-btn" type="button">Pause</button>
    <div class="speed-group" id="speed-group" role="group" aria-label="Playback speed"></div>
    <div class="seed-group">
      <label for="seed-input">Seed</label>
      <input id="seed-input" type="number" value="42" step="1">
      <button id="new-voyage-btn" type="button">New voyage</button>
      <button id="random-btn" type="button">Random seed</button>
    </div>
  </div>
  <div id="daily-banner">
    <span id="daily-text"></span>
    <button id="daily-btn" type="button" hidden>★ Today's voyage</button>
  </div>
</header>
<div id="day-ribbon" aria-label="The ship's day: watch phase, current block, and the next routine beat"></div>
<div id="weather-banner">Space weather: <b id="weather-name">calm</b></div>
<main>
  <section aria-label="Ship schematic">
    <h2>Ship</h2>
    <div class="deck-switch" role="group" aria-label="Deck selector">
      <button id="deck1-btn" type="button">Deck 1 · Upper</button>
      <button id="deck2-btn" type="button">Deck 2 · Lower</button>
    </div>
    <div class="ship-stage">
      <div id="alert-stack" aria-live="polite" aria-label="Ship alerts"></div>
      <canvas id="ship-canvas" role="img" aria-label="Top-down deck plan of the ship: rooms, equipment, and crew at work"></canvas>
    </div>
    <div class="deck-foot">
      <canvas id="minimap-canvas" role="img" aria-label="Minimap of both decks: tap a deck to view it"></canvas>
      <p class="deck-hint">Two decks, one ship. The minimap shows both: coloured dots are crew, gold ticks are the lifts, and a pulsing room needs help. Keys 7 and 8 switch decks.</p>
    </div>
  </section>
  <div id="side">
    <section aria-label="Crew">
      <h2>Crew</h2>
      <div id="crew-panel"></div>
    </section>
    <section aria-label="Chronicle">
      <div class="section-head">
        <h2>Chronicle</h2>
        <div class="log-toggle" role="group" aria-label="Chronicle detail">
          <button id="log-highlights-btn" type="button" aria-pressed="true">Highlights</button>
          <button id="log-full-btn" type="button" aria-pressed="false">Full log</button>
        </div>
      </div>
      <div id="chronicle"></div>
    </section>
  </div>
</main>
<div id="person-card" hidden>
  <button id="person-close" type="button" aria-label="Close person card">×</button>
  <div class="person-head">
    <canvas id="person-face" class="face" width="64" height="64"></canvas>
    <div>
      <div class="pname" id="person-name"></div>
      <div class="prole" id="person-role"></div>
      <div class="pwhere" id="person-where"></div>
    </div>
  </div>
  <p id="person-bio"></p>
  <div id="person-dossier"></div>
  <h3>Recently</h3>
  <div id="person-recent"></div>
</div>
<div id="toast" role="status" hidden></div>
<script src="./dist/bundle.js"></script>
</body>
</html>
